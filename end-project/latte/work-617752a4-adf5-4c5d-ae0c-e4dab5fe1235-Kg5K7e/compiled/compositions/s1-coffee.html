  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">

    <div id="s1-hook" class="display scrim">
      <span class="w">Kena</span><span class="w">stop</span><span class="w k">latte</span><span class="w">ke</span><span class="w">kalau</span><span class="w">nak</span><span class="w">mula</span><span class="w k">takaful?</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // camera: medium push, then punch-in on face + cup, then zoom through the cup
    tl.fromTo("#s1-cam", { scale: 1.04, transformOrigin: "45% 42%" }, { scale: 1.11, duration: 3.4, ease: "power2.inOut" }, 0);
    tl.set("#s1-cam", { scale: 1.3, transformOrigin: "43% 46%" }, 3.4);
    tl.to("#s1-cam", { scale: 1.37, duration: 4.1, ease: "power2.inOut" }, 3.4);
    tl.fromTo(
      "#s1-cam",
      { filter: "blur(0px)" },
      { scale: 3.1, transformOrigin: "42% 56%", filter: "blur(16px)", duration: 0.45, ease: "power3.in", immediateRender: false },
      7.55,
    );
    // hook: first word already on frame 0, the rest blur in per word
    const words = gsap.utils.toArray("#s1-hook .w");
    tl.fromTo("#s1-hook", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    words.forEach((w, i) => {
      if (i === 0) {
        tl.fromTo(w, { opacity: 1, filter: "blur(0px)" }, { opacity: 1, duration: 0.01 }, 0);
      } else {
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 0.1 + i * 0.07);
      }
    });
    tl.to("#s1-hook", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 3.2);
    window.__timelines["s1"] = tl;
