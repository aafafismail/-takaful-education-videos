    {"id":"color-accent","type":"color","label":"Accent (keywords, highlighter)","default":"#FFC93C"},

>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/caveat-700.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        --color-ink: #2b2622;
        --color-pen: #1e3a8a;
        --color-accent: #ffc93c;
        --paper-thermal: #f7f2e7;
        --paper-note: #fbf6ea;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a120b;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
      }

      /* ---------- shared paper objects ---------- */
      .cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cam img.plate {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .receipt {
        position: absolute;
        background: var(--paper-thermal);
        color: var(--color-ink);
        font-family: "Space Mono", monospace;
        font-weight: 700;
        box-shadow: 0 18px 28px rgba(45, 25, 8, 0.38);
        /* torn zig-zag bottom edge */
        -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 14px) no-repeat,
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 28px 14px repeat-x;
        mask: linear-gradient(#000 0 0) top / 100% calc(100% - 14px) no-repeat,
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 28px 14px repeat-x;
      }
      .receipt .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        white-space: nowrap;
      }
      .note {
        position: absolute;
        background-color: var(--paper-note);
        background-image: linear-gradient(90deg, transparent 94px, #e5a6a0 94px 97px, transparent 97px),
          repeating-linear-gradient(transparent 0 63px, #bfd0e6 63px 65px);
        box-shadow: 0 20px 34px rgba(45, 25, 8, 0.36);
        border-radius: 6px;
        color: var(--color-pen);
      }
      .hand {
        font-family: "Caveat", cursive;
        font-weight: 700;
        color: var(--color-pen);
        white-space: nowrap;
        line-height: 1;
      }
      .hl {
        position: relative;
        isolation: isolate;
      }
      .hl > .swipe {
        position: absolute;
        left: -8px;
        right: -8px;
        top: 52%;
        height: 44%;
        background: var(--color-accent);
        opacity: 0.85;
        z-index: -1;
        transform-origin: left center;
        border-radius: 4px;
      }
      .display {
        font-family: "Archivo Black", sans-serif;
        color: #fff;
        text-align: center;
        letter-spacing: -0.01em;
        line-height: 1.06;
      }
      .scrim {
        background: rgba(24, 12, 4, 0.42);
        border-radius: 18px;
      }
    </style>
  </head>
