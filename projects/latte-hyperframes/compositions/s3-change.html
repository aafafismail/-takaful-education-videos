  <script>
    // calendar cells (static markup built once at init, before the timeline)
    const MARKED = [3, 7, 10, 14, 17, 21, 24, 28];
    const days = document.querySelector("#s3-days");
    for (let d = 1; d <= 30; d++) {
      const c = document.createElement("div");
      c.className = "s3-day";
      c.innerHTML = (MARKED.includes(d) ? '<span class="s3-ring"></span>' : "") + "<span>" + d + "</span>";
      days.appendChild(c);
    }

    const tl = gsap.timeline({ paused: true });
    // whip in from the right
    tl.fromTo("#s3-cam", { x: 760, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0);
    tl.fromTo("#s3-cam", { scale: 1.12, transformOrigin: "50% 40%" }, { scale: 1.04, duration: 4.4, ease: "power2.inOut", immediateRender: false }, 0);
    tl.set("#s3-cam", { scale: 1.28, transformOrigin: "40% 45%" }, 4.4);
    tl.to("#s3-cam", { scale: 1.34, duration: 8.4, ease: "power2.inOut" }, 4.4);

    // receipt prints downward line by line
    tl.fromTo("#s3-receipt", { clipPath: "inset(0 0 100% 0)", y: -30 }, { clipPath: "inset(0 0 60% 0)", y: 0, duration: 0.45, ease: "power2.out" }, 0.85);
    tl.fromTo("#s3-r2,#s3-r3,#s3-r4", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.to("#s3-r2,#s3-r3", { opacity: 1, duration: 0.05 }, 8.2);
    tl.to("#s3-receipt", { clipPath: "inset(0 0 25% 0)", duration: 0.2, ease: "power2.out" }, 8.2);
    tl.to("#s3-r4", { opacity: 1, duration: 0.05 }, 8.42);
    tl.to("#s3-receipt", { clipPath: "inset(0 0 0% 0)", duration: 0.2, ease: "power2.out" }, 8.42);
    tl.fromTo("#s3-swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 8.7);
    tl.to("#s3-receipt", { y: -420, rotation: 6, duration: 0.35, ease: "power3.in" }, 12.35);

    // loyalty card slides in, 8 cups stamped
    tl.fromTo("#s3-card", { x: -1000, rotation: -10 }, { x: 0, rotation: -2, duration: 0.6, ease: "back.out(1.2)" }, 4.55);
    gsap.utils.toArray("#s3-card .s3-stamp").forEach((s, i) => {
      tl.fromTo(s, { opacity: 0, scale: 1.3, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4 + (i % 3) * 4, duration: 0.18, ease: "power3.out" }, 5.0 + i * 0.42);
    });
    tl.to("#s3-card", { y: 1250, rotation: 6, duration: 0.35, ease: "power3.in" }, 9.0);

    // calendar drops in; 8 coffee rings stamp; handwritten message
    tl.fromTo("#s3-cal", { y: -1400, rotation: 4 }, { y: 0, rotation: 1.5, duration: 0.6, ease: "back.out(1.1)" }, 9.25);
    gsap.utils.toArray("#s3-cal .s3-ring").forEach((r, i) => {
      tl.fromTo(r, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power3.out" }, 9.95 + i * 0.16);
    });
    tl.fromTo("#s3-msg", { clipPath: "inset(-30% 100% -30% 0)" }, { clipPath: "inset(-30% 0% -30% 0)", duration: 0.8, ease: "none" }, 10.75);
    tl.fromTo("#s3-msg-swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 11.6);

    // blur swap out
    tl.to("#root", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 12.82);
    window.__timelines["s3"] = tl;
